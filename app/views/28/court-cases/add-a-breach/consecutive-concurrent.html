{% extends "../../template.html" %}
{% set showFullNav = false %}
{% block content %}
<!-- What is the confirmed date -->
<div class="govuk-grid-row govuk-!-margin-top-4">
    <div class="govuk-grid-column-two-thirds">
        {% if data.edit == 'true' %}
            <form class="form" action="check-answers-breach" method="post">
        {% else %}
        <form method="post" action="/consecutive-concurrent-submit">
            {% endif %}
                    <div class="govuk-form-group">
                        <fieldset class="govuk-fieldset">
                            <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
                               
                                <h1 class="govuk-fieldset__heading">
                                    <span class="govuk-caption-l">Add offences</span>
                                    Is the sentence consecutive or concurrent?
                                </h1>
                               
                            </legend>
                            <div class="govuk-radios govuk-radios" data-module="govuk-radios">
                                <div class="govuk-radios__item">
                                    <input class="govuk-radios__input" id="consecutive-concurrent-1" name="consecutiveconcurrent" type="radio" value="Consecutive" 
                                    {% if data.sentence['consecutive-concurrent']=='Consecutive' %} checked {% endif %}>
                                    <label class="govuk-label govuk-radios__label" for="consecutive-concurrent-1">
                                        Consecutive
                                    </label>
                                </div>
                                <div class="govuk-radios__item">
                                    <input class="govuk-radios__input" id="consecutive-concurrent-2"
                                        name="consecutiveconcurrent" type="radio" value="Concurrent" {% if data.sentence['consecutive-concurrent']=='Concurrent' %} checked {% endif %}>
                                    <label class="govuk-label govuk-radios__label" for="consecutive-concurrent-2">
                                        Concurrent
                                    </label>
                                </div>
                               
                                <div class="govuk-radios__divider">or</div>
                                <div class="govuk-radios__item">
                                    <input class="govuk-radios__input" id="consecutive-concurrent-3"
                                        name="consecutiveconcurrent" type="radio" value="Forthwith" {% if data.sentence['consecutive-concurrent']=='Forthwith' %} checked {% endif %}>
                                     <label class="govuk-label govuk-radios__label" for="consecutive-concurrent-3">
                                        Forthwith
                                        <div class="govuk-hint">There can only be one forthwith sentence in a case</div>
                                    </label>
                                </div>
                               
                               
                            </div>
                        </fieldset>
                    </div>
                    <div class="govuk-button-group">
                        <button type="submit" class="govuk-button" data-module="govuk-button">
                            Continue
                        </button>
                    </div>
                </form>
    </div>
    <div class="govuk-grid-column-one-third">
        {% set showOffences = true %}
        {% include "includes/templates/appearance-info.njk" %}
    </div>
</div>
{% endblock %}
